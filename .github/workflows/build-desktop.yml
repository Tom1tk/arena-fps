name: Build Desktop App

# Run manually from the Actions tab, or automatically when a version tag is pushed
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to attach files to a Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build desktop app
        run: pake https://fps.endless777.online --name ArenaFPS --width 1280 --height 720

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.exe,*.msi | Select-Object FullName

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArenaFPS-Windows
          path: |
            **/*.msi
            **/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.msi
            **/*.exe
