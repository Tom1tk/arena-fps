name: Build Desktop App

# Run manually from the Actions tab, or automatically when a version tag is pushed
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to attach files to a Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Pake CLI
        run: npm install -g pake-cli

      - name: Build desktop app
        run: pake https://fps.endless777.online --name ArenaFPS --width 1280 --height 720

      - name: Locate the portable executable
        shell: pwsh
        run: |
          # The raw app binary lives in a `release` folder but NOT in a `bundle`,
          # `deps`, or `build` folder (those are installers / Rust intermediates).
          $roots = @()
          $r = (npm root -g); if (Test-Path $r) { $roots += $r }
          if (Test-Path $env:USERPROFILE) { $roots += $env:USERPROFILE }
          if (Test-Path $env:LOCALAPPDATA) { $roots += $env:LOCALAPPDATA }

          $candidates = @()
          foreach ($root in $roots) {
            $candidates += Get-ChildItem -Path $root -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match '\\release\\' -and
                $_.FullName -notmatch '\\bundle\\' -and
                $_.FullName -notmatch '\\deps\\'   -and
                $_.FullName -notmatch '\\build\\'
              }
          }

          Write-Host "=== Candidate executables found ==="
          $candidates | Select-Object FullName, @{N='MB';E={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

          # The app binary is the largest such .exe.
          $app = $candidates | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $app) { Write-Error "No standalone .exe found — inspect the candidate list above and adjust the filter."; exit 1 }

          Copy-Item $app.FullName -Destination "$env:GITHUB_WORKSPACE\ArenaFPS.exe" -Force
          Write-Host "Selected portable exe: $($app.FullName)"

      - name: Upload portable exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArenaFPS-portable
          path: ArenaFPS.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ArenaFPS.exe
