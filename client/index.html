<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena FPS</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; }
    /* Prevent text selection on all HUD elements */
    #hud-overlay, #title-overlay, #pause-overlay, #settings-overlay,
    #death-overlay, #post-match-overlay, #tab-scoreboard {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* HUD overlay */
    #hud-overlay {
      position: fixed; inset: 0; z-index: 100;
      pointer-events: none;
    }

    /* Crosshair */
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 24px; height: 24px;
    }
    #crosshair .h {
      position: absolute; top: 50%; left: 0; right: 0; height: 2px;
      background: #0f0; transform: translateY(-50%);
    }
    #crosshair .v {
      position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
      background: #0f0; transform: translateX(-50%);
    }

    /* FPS Counter */
    #fps-counter {
      position: absolute; top: 8px; left: 8px;
      font: bold 14px/1.4 monospace; color: #0f0;
      text-shadow: 1px 1px 2px #000;
    }
    #debug-line {
      font: 11px/1.4 monospace; color: #8f8;
      margin-top: 2px;
    }

    /* Bottom-left: HP / Ammo */
    #status-bar {
      position: absolute; bottom: 20px; left: 20px;
      font: bold 20px/1 monospace; color: #fff;
      text-shadow: 1px 1px 3px #000;
    }
    #hp-bar {
      width: 200px; height: 8px; background: rgba(0,0,0,0.5);
      border: 1px solid #444; border-radius: 4px; margin-top: 4px;
    }
    #hp-fill {
      height: 100%; width: 100%; background: #0c0;
      border-radius: 3px; transition: width 0.15s;
    }
    #ammo-display {
      font: bold 28px/1.2 monospace; color: #fff;
      text-shadow: 1px 1px 3px #000;
    }

    /* Bottom-right: Kill feed */
    #kill-feed {
      position: absolute; top: 20px; right: 20px;
      font: 13px/1.8 monospace; color: #fff;
      text-shadow: 1px 1px 2px #000;
      text-align: right;
    }

    /* Top-left compact scoreboard */
    #scoreboard {
      position: absolute; top: 40px; left: 8px;
      font: 12px/1.6 monospace; color: #ccc;
      text-shadow: 1px 1px 2px #000;
    }

    /* Graphics toggle */
    #graphics-toggle {
      position: fixed; bottom: 12px; right: 12px; z-index: 101;
      pointer-events: auto;
      background: rgba(0,0,0,0.6); color: #ccc; border: 1px solid #555;
      padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    #graphics-toggle:hover { background: rgba(40,40,40,0.9); color: #fff; }

    /* Pause overlay */
    #pause-overlay {
      position: fixed; inset: 0; z-index: 300;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75); color: #fff;
    }
    #pause-overlay h2 { font-size: 2rem; margin-bottom: 1rem; }
    #pause-overlay button {
      margin: 4px; padding: 8px 24px; font-size: 1rem; border: 1px solid #555;
      border-radius: 6px; background: rgba(40,40,40,0.9); color: #fff; cursor: pointer;
    }
    #pause-overlay button:hover { background: #555; }

    /* Tab scoreboard overlay */
    #tab-scoreboard {
      position: fixed; inset: 0; z-index: 250;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.5); color: #fff;
      font: 14px/2 monospace;
    }
    #tab-scoreboard table {
      border-collapse: collapse; width: 60%; max-width: 500px;
    }
    #tab-scoreboard th, #tab-scoreboard td {
      padding: 4px 12px; text-align: left; border-bottom: 1px solid #333;
    }
    #tab-scoreboard th { color: #888; font-weight: normal; }
    #tab-scoreboard td:last-child { text-align: right; }

    /* Title / Lobby screen */
    #title-overlay {
      position: fixed; inset: 0; z-index: 400;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85); color: #fff;
    }
    #title-overlay h1 { font-size: 3rem; margin-bottom: 0.5rem; letter-spacing: 0.1em; }
    #title-overlay p { color: #888; margin-bottom: 0.5rem; font-size: 1rem; }
    #title-overlay .controls { color: #666; margin-bottom: 1rem; font-size: 0.85rem; line-height: 1.8; text-align: center; }
    #title-overlay button {
      padding: 8px 24px; font-size: 1rem; border: none; border-radius: 6px;
      background: #2a6; color: #fff; cursor: pointer;
    }
    #title-overlay button:hover { background: #3b7; }
    #title-overlay button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Lobby panel */
    #lobby-panel {
      display: none; flex-direction: column; align-items: center; width: 440px;
      margin-top: 16px;
    }
    #lobby-panel.visible { display: flex; }
    #lobby-code-display {
      font: bold 36px monospace; color: #ff0; letter-spacing: 0.3em; margin: 8px 0;
      text-shadow: 0 0 12px rgba(255,255,0,0.4);
    }
    #lobby-roster {
      width: 100%; margin: 8px 0; font: 14px monospace;
    }
    #lobby-roster table { width: 100%; border-collapse: collapse; }
    #lobby-roster th, #lobby-roster td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #333; }
    #lobby-roster th { color: #888; }
    #lobby-roster .ready-icon { color: #0f0; }
    #lobby-roster .not-ready-icon { color: #666; }
    #lobby-status {
      font: 13px monospace; color: #aaa; margin: 4px 0; text-align: center;
    }
    #lobby-error {
      font: 13px monospace; color: #f66; margin: 4px 0; text-align: center; min-height: 18px;
    }
    #lobby-buttons {
      display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center;
    }
    #lobby-buttons button {
      padding: 8px 20px; font-size: 0.9rem;
    }
    #lobby-join-row {
      display: flex; gap: 8px; align-items: center; margin-top: 8px;
    }
    #lobby-join-row input {
      padding: 6px 12px; font-size: 16px; font-family: monospace;
      background: #222; color: #fff; border: 1px solid #444; border-radius: 4px;
      text-align: center; width: 120px; text-transform: uppercase; letter-spacing: 0.2em;
    }

    /* Hit marker */
    #hit-marker {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 30px; height: 30px; opacity: 0; transition: opacity 0.1s;
      pointer-events: none;
    }
    #hit-marker.show { opacity: 1; }
    #hit-marker .line {
      position: absolute; background: #fff;
    }
    #hit-marker .l1 { top: 0; left: 5px; width: 2px; height: 8px; transform: rotate(45deg); transform-origin: top left; }
    #hit-marker .l2 { top: 0; right: 5px; width: 2px; height: 8px; transform: rotate(-45deg); transform-origin: top right; }
    #hit-marker .l3 { bottom: 0; left: 5px; width: 2px; height: 8px; transform: rotate(-45deg); transform-origin: bottom left; }
    #hit-marker .l4 { bottom: 0; right: 5px; width: 2px; height: 8px; transform: rotate(45deg); transform-origin: bottom right; }
  </style>
</head>
<body>
  <!-- HUD -->
  <div id="hud-overlay">
    <div id="crosshair"><div class="h"></div><div class="v"></div></div>
    <div id="fps-counter"></div>
    <div id="debug-line"></div>
    <div id="status-bar">
      <div id="ammo-display">15 / ∞</div>
      <div id="hp-bar"><div id="hp-fill"></div></div>
    </div>
    <div id="kill-feed"></div>
    <div id="scoreboard"></div>
    <div id="hit-marker">
      <div class="line l1"></div><div class="line l2"></div>
      <div class="line l3"></div><div class="line l4"></div>
    </div>
  </div>

  <button id="graphics-toggle">Graphics: High</button>

  <!-- Pause overlay -->
  <div id="pause-overlay">
    <h2>PAUSED</h2>
    <button id="resume-btn">Resume</button>
    <button id="settings-btn">Settings</button>
    <button id="leave-btn">Leave to Menu</button>
  </div>

  <!-- Tab scoreboard -->
  <div id="tab-scoreboard">
    <table>
      <thead><tr><th>#</th><th>Name</th><th>Kills</th><th>Deaths</th></tr></thead>
      <tbody id="tab-sb-body"></tbody>
    </table>
  </div>

  <!-- Title / Lobby screen -->
  <div id="title-overlay">
    <h1>ARENA FPS</h1>
    <p>Browser Free-For-All</p>

    <!-- Name gate -->
    <div style="margin-bottom:12px; text-align:center;">
      <label for="player-name" style="color:#aaa; font-size:14px;">Callsign</label><br>
      <input id="player-name" type="text" placeholder="Enter name (3–20 chars)" maxlength="20"
        style="margin-top:6px; padding:8px 16px; font-size:16px; font-family:monospace;
        background:#222; color:#fff; border:1px solid #444; border-radius:4px; text-align:center;
        width:240px; outline:none;" />
      <div id="name-error" style="color:#f66; font-size:12px; margin-top:4px; min-height:16px;"></div>
    </div>

    <!-- Settings panel (collapsible) -->
    <div id="menu-settings" style="margin-bottom:16px; display:grid; grid-template-columns:1fr 1fr; gap:12px; width:400px;">
      <div>
        <label style="color:#aaa; font-size:12px;">Sensitivity</label><br>
        <input id="menu-sensitivity" type="range" min="1" max="20" step="0.5" value="10"
          style="width:180px;" />
        <span id="menu-sensitivity-val" style="color:#fff; font-size:13px; font-family:monospace;"></span>
      </div>
      <div>
        <label style="color:#aaa; font-size:12px;">FOV</label><br>
        <input id="menu-fov" type="range" min="60" max="120" step="1" value="90"
          style="width:180px;" />
        <span id="menu-fov-val" style="color:#fff; font-size:13px; font-family:monospace;"></span>
      </div>
      <div>
        <label style="color:#aaa; font-size:12px;">Crosshair</label><br>
        <select id="menu-crosshair-type" style="padding:4px; background:#222; color:#fff; border:1px solid #444; border-radius:4px;">
          <option value="cross">Cross</option>
          <option value="dot">Dot</option>
          <option value="crossdot">Cross + Dot</option>
          <option value="circle">Circle</option>
        </select>
      </div>
      <div>
        <label style="color:#aaa; font-size:12px;">Crosshair Colour</label><br>
        <input id="menu-crosshair-colour" type="color" value="#00ff00"
          style="width:50px; height:28px; border:none; cursor:pointer;" />
      </div>
      <div>
        <label style="color:#aaa; font-size:12px;">Crosshair Size</label><br>
        <input id="menu-crosshair-size" type="range" min="12" max="48" step="2" value="24"
          style="width:180px;" />
      </div>
      <div>
        <label style="color:#aaa; font-size:12px;">Graphics</label><br>
        <select id="menu-graphics" style="padding:4px; background:#222; color:#fff; border:1px solid #444; border-radius:4px;">
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>

    <div class="controls">
      WASD — Move &nbsp;|&nbsp; Mouse — Look &nbsp;|&nbsp; Click — Shoot<br>
      Space — Jump &nbsp;|&nbsp; Ctrl — Crouch &nbsp;|&nbsp; R — Reload<br>
      Esc — Pause &nbsp;|&nbsp; Tab — Scoreboard
    </div>

    <!-- Lobby panel (shown after connecting) -->
    <div id="lobby-panel">
      <div id="lobby-code-display"></div>
      <div id="lobby-roster">
        <table>
          <thead><tr><th>Name</th><th>Ready</th><th>Role</th></tr></thead>
          <tbody id="lobby-roster-body"></tbody>
        </table>
      </div>
      <div id="lobby-status"></div>
      <div id="lobby-error"></div>
      <div id="lobby-buttons">
        <button id="lobby-create" style="display:none;">Create Lobby</button>
        <button id="lobby-ready" style="display:none;">Ready</button>
        <button id="lobby-start" style="display:none;">Start Match</button>
        <button id="lobby-leave" style="display:none;">Leave</button>
        <button id="lobby-disconnect" style="display:none;">Disconnect</button>
      </div>
      <div id="lobby-join-row">
        <input id="lobby-join-code" type="text" placeholder="CODE" maxlength="5" />
        <button id="lobby-join">Join</button>
      </div>
    </div>

    <!-- Pre-lobby buttons (shown when not connected) -->
    <button id="start-btn">ENTER ARENA</button>
  </div>

  <!-- Settings overlay (in-game, via pause) -->
  <div id="settings-overlay" style="display:none; position:fixed; inset:0; z-index:310;
       background:rgba(0,0,0,0.85); color:#fff; flex-direction:column; align-items:center;
       justify-content:center; font-family:monospace;">
    <h2 style="margin-bottom:20px;">SETTINGS</h2>
    <div id="in-game-settings" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; width:440px;">
      <div>
        <label style="color:#aaa; font-size:12px;">Sensitivity</label><br>
        <input id="sg-sensitivity" type="range" min="1" max="20" step="0.5" value="10"
          style="width:200px;" />
        <span id="sg-sensitivity-val" style="color:#fff; font-size:13px;"></span>
      </div>
      <div>
        <label style="color:#aaa; font-size:12px;">FOV</label><br>
        <input id="sg-fov" type="range" min="60" max="120" step="1" value="90"
          style="width:200px;" />
        <span id="sg-fov-val" style="color:#fff; font-size:13px;"></span>
      </div>
      <div>
        <label style="color:#aaa; font-size:12px;">Crosshair</label><br>
        <select id="sg-crosshair-type" style="padding:4px; background:#222; color:#fff; border:1px solid #444; border-radius:4px;">
          <option value="cross">Cross</option>
          <option value="dot">Dot</option>
          <option value="crossdot">Cross + Dot</option>
          <option value="circle">Circle</option>
        </select>
      </div>
      <div>
        <label style="color:#aaa; font-size:12px;">Crosshair Colour</label><br>
        <input id="sg-crosshair-colour" type="color" value="#00ff00"
          style="width:50px; height:28px; border:none; cursor:pointer;" />
      </div>
      <div>
        <label style="color:#aaa; font-size:12px;">Crosshair Size</label><br>
        <input id="sg-crosshair-size" type="range" min="12" max="48" step="2" value="24"
          style="width:200px;" />
      </div>
      <div>
        <label style="color:#aaa; font-size:12px;">Graphics</label><br>
        <select id="sg-graphics" style="padding:4px; background:#222; color:#fff; border:1px solid #444; border-radius:4px;">
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
      </div>
    </div>
    <button id="settings-close-btn" style="margin-top:24px; padding:10px 32px; font-size:16px;
      border:none; border-radius:6px; background:#2a6; color:#fff; cursor:pointer;">
      DONE
    </button>
  </div>

  <!-- Death screen -->
  <div id="death-overlay" style="display:none; position:fixed; inset:0; z-index:350;
       background:rgba(120,0,0,0.4); color:#fff; font:24px monospace;
       flex-direction:column; align-items:center; justify-content:center;">
    <div style="font-size:36px; margin-bottom:12px;">YOU DIED</div>
    <div id="death-info" style="font-size:16px; margin-bottom:8px; color:#faa;"></div>
    <div id="death-countdown" style="font-size:20px; color:#ff8;"></div>
  </div>

  <!-- Post-match screen -->
  <div id="post-match-overlay" style="display:none; position:fixed; inset:0; z-index:350;
       background:rgba(0,0,0,0.7); color:#fff; font:20px monospace;
       flex-direction:column; align-items:center; justify-content:center;">
    <div style="font-size:36px; margin-bottom:12px;">MATCH COMPLETE</div>
    <div id="post-match-stats" style="font-size:16px; margin-bottom:16px; line-height:2;"></div>
    <div id="post-match-countdown" style="font-size:18px; color:#ff8;"></div>
  </div>

  <!-- Damage indicator (screen edge flash) -->
  <div id="damage-indicator" style="position:fixed; inset:0; z-index:150; pointer-events:none;
       border:4px solid rgba(255,0,0,0); transition:border-color 0.1s;"></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
